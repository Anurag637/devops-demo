---
# DevOps Lab 3 - Task 1: Application Automation using Ansible
# Aim: Configure infrastructure and automate Nginx web server deployment across target nodes

- name: Setup and configure web servers on target nodes
  hosts: webservers
  become: yes
  gather_facts: yes

  vars:
    web_port: 80
    site_title: "DevOps Lab 3 - Automated Web Server"

  handlers:
    - name: restart nginx
      service:
        name: nginx
        state: restarted

  tasks:
    - name: 1. Test ping connectivity to target node
      debug:
        msg: "Connected to {{ inventory_hostname }} (IP: {{ ansible_default_ipv4.address | default('172.20.0.1x') }})"

    - name: 2. Update apt repository cache
      apt:
        update_cache: yes
        cache_valid_time: 3600
      when: ansible_os_family == "Debian"

    - name: 3. Install Nginx and curl packages
      apt:
        name:
          - nginx
          - curl
        state: present

    - name: 4. Copy custom Nginx configuration file
      template:
        src: templates/default.conf.j2
        dest: /etc/nginx/conf.d/default.conf
      notify: restart nginx

    - name: 5. Deploy custom index.html web page
      template:
        src: templates/index.html.j2
        dest: /var/www/html/index.html
      notify: restart nginx

    - name: 6. Make sure Nginx service is running and enabled
      service:
        name: nginx
        state: started
        enabled: yes

    - name: 7. Verify web server is responding locally
      command: curl -s -o /dev/null -w "%{http_code}" http://localhost/healthz
      register: result
      changed_when: false

    - name: 8. Print deployment status
      debug:
        msg: "Web server successfully configured on {{ inventory_hostname }}. Health status: HTTP {{ result.stdout }}"
